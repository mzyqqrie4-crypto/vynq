name: Release

# Push a tag like v0.6.0 (matching versionName in android/app/build.gradle.kts) to build a
# signed release APK and publish it on GitHub Releases. The signing key and backend settings
# come from encrypted repository secrets; nothing secret is stored in the repository.
#
# Secrets: VYNQ_KEYSTORE_BASE64, VYNQ_KEYSTORE_PASSWORD, VYNQ_KEY_ALIAS, VYNQ_KEY_PASSWORD,
#          VYNQ_SUPABASE_URL, VYNQ_SUPABASE_ANON_KEY

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VYNQ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VYNQ_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Tests run without the backend settings, as in normal CI: with a real server
      # configured, screens under test start talking to it.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Build the signed release
        env:
          VYNQ_KEYSTORE_PASSWORD: ${{ secrets.VYNQ_KEYSTORE_PASSWORD }}
          VYNQ_KEY_ALIAS: ${{ secrets.VYNQ_KEY_ALIAS }}
          VYNQ_KEY_PASSWORD: ${{ secrets.VYNQ_KEY_PASSWORD }}
          VYNQ_SUPABASE_URL: ${{ secrets.VYNQ_SUPABASE_URL }}
          VYNQ_SUPABASE_ANON_KEY: ${{ secrets.VYNQ_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VYNQ_SUPABASE_URL" ] || [ -z "$VYNQ_SUPABASE_ANON_KEY" ]; then
            echo "::error::Backend secrets are missing (the app couldn't sign in)"; exit 1
          fi
          ./gradlew :app:assembleRelease --console=plain

      - name: Verify the signature and name the file
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          cp "$apk" "$RUNNER_TEMP/vynq-$VERSION.apk"
          (cd "$RUNNER_TEMP" && sha256sum "vynq-$VERSION.apk" > "vynq-$VERSION.apk.sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/vynq-$VERSION.apk" "$RUNNER_TEMP/vynq-$VERSION.apk.sha256" \
            --title "vynq $VERSION" --notes-file ../docs/INSTALL.md
