<!-- Sign-in code email. Supabase fills in {{ .Token }} (6 digits). No links: the app asks for the code. -->
<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:420px;margin:0 auto;padding:32px 24px;color:#07070C">
  <p style="font-size:15px;margin:0 0 20px">Your vynq sign-in code:</p>
  <p style="font-size:34px;font-weight:600;letter-spacing:8px;margin:0 0 20px">{{ .Token }}</p>
  <p style="font-size:13px;color:#5b5b66;margin:0">It expires in 10 minutes. If you didn't try to sign in, ignore this email. Nobody from vynq will ever ask you for this code.</p>
</div>
